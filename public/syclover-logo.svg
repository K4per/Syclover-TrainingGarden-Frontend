<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 96" role="img" aria-labelledby="title desc">
  <title id="title">Syclover</title>
  <desc id="desc">Green three-leaf clover with the Syclover wordmark</desc>
  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63ff9a"/>
      <stop offset=".55" stop-color="#38ef7d"/>
      <stop offset="1" stop-color="#16ad59"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="leaf" d="M49 43C38 37 28 27 29 16C30 5 38 1 49 2C60 1 68 5 69 16C70 27 60 37 49 43Z"/>
  </defs>
  <g transform="translate(3 1)" filter="url(#glow)">
    <path d="M49 43C56 52 65 61 70 71C74 79 76 85 78 92" fill="none" stroke="#38ef7d" stroke-width="4.2" stroke-linecap="round"/>
    <g transform="rotate(75 49 43)">
      <use href="#leaf" fill="url(#leafGreen)" stroke="#0b773b" stroke-width="1.4"/>
      <use href="#leaf" transform="rotate(120 49 43)" fill="url(#leafGreen)" stroke="#0b773b" stroke-width="1.4"/>
      <use href="#leaf" transform="rotate(240 49 43)" fill="url(#leafGreen)" stroke="#0b773b" stroke-width="1.4"/>
      <path d="M49 42L49 18M47 44L28 56M51 44L69 56" fill="none" stroke="#0d8f48" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>
    </g>
  </g>
  <text x="106" y="61" fill="#f8f5ef" font-size="48" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" font-style="italic" letter-spacing="-3">Syclover</text>
  <text x="112" y="82" fill="#38ef7d" font-size="8.5" font-family="ui-monospace,monospace" font-weight="700" letter-spacing="4.2">TRAINING GARDEN</text>
</svg>
